{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Bienvenida</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fafc);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hero {
            background: linear-gradient(120deg, #1d4ed8, #3b82f6);
            color: #ffffff;
            border-radius: 22px;
            padding: 80px 50px;
            text-align: center;
            box-shadow: 0 18px 38px rgba(29, 78, 216, 0.25);
            max-width: 700px;
            width: 100%;
        }

        .hero h1 {
            margin: 0 0 15px;
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: 0.5px;
        }

        .hero p {
            margin: 0 0 30px;
            font-size: 1.15rem;
            opacity: 0.96;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: #ffffff;
            color: #1d4ed8;
            padding: 14px 34px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22);
        }

        footer {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>¡Bienvenido a la Biblioteca Digital!</h1>
        <p>Tu espacio para descubrir, explorar y disfrutar del mundo de la lectura.</p>
        <a href="{% url 'catalogo:inicio' %}" class="btn">
            Entrar a la Biblioteca →
        </a>
    </header>

    <footer>© 2026 Biblioteca Digital — Proyecto Django ADSO</footer>
</body>
</html>
