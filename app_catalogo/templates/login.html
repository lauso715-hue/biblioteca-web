<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Biblioteca</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; border-top: 5px solid #0056b3; width: 350px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; }
        label { display: block; margin-top: 15px; color: #333; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .error { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
        .link { display: block; text-align: center; margin-top: 15px; color: #0056b3; text-decoration: none; font-size: 14px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>Iniciar Sesión</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <label>Usuario:</label>
            <input type="text" name="usuario" required>
            <label>Contraseña:</label>
            <input type="password" name="contrasena" required>
            <button type="submit">Ingresar</button>
        </form>
        <a href="{% url 'catalogo:inicio' %}" class="link">← Volver al Inicio</a>
    </div>
</body>
</html>
