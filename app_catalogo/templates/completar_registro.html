<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Completar Registro</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 50px; }
        .form-container { background: white; padding: 30px; border-radius: 8px; border-top: 5px solid #0056b3; width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; }
        label { display: block; margin-top: 10px; color: #333; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; margin-top: 20px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Completar Registro</h2>
        <p>Hola <strong>{{ persona.Nombre }}</strong>, tu rol de <strong>{{ persona.Rol }}</strong> ha sido aprobado.</p>
        
        <form action="" method="POST">
            {% csrf_token %}
            
            <!-- CONDICIONAL HTML (Puro Django) -->
            {% if persona.Rol == 'Autor' %}
                <label>Nacionalidad:</label>
                <input type="text" name="nacionalidad" required>

                <label>Biografía:</label>
                <textarea name="biografia" rows="4" required></textarea>
                
            {% elif persona.Rol == 'Estudiante' %}
                <label>Dirección:</label>
                <input type="text" name="direccion" required>

                <label>Grado Escolar:</label>
                <input type="text" name="grado_escolar" required>
            {% endif %}

            <button type="submit">Finalizar Registro</button>
        </form>
    </div>
</body>
</html>
