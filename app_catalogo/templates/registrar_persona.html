<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Persona</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .form-container { background: white; padding: 30px; border-radius: 8px; border-top: 5px solid #0056b3; width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; text-align: center; }
        label { display: block; margin-top: 10px; color: #333; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .btn-volver { display: block; text-align: center; margin-top: 15px; color: #0056b3; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registro de Persona</h2>
        <form action="" method="POST">
            {% csrf_token %}
            <label>Número de Documento:</label>
            <input type="text" name="numero_documento" required>

            <label>Tipo de Documento:</label>
            <select name="tipo_documento" required>
                <option value="Cédula de Ciudadania">Cédula de Ciudadania</option>
                <option value="Tarjeta de Identidad">Tarjeta de Identidad</option>
                <option value="Pasaporte">Pasaporte</option>
            </select>

            <label>Nombre:</label>
            <input type="text" name="nombre" required>

            <label>Apellido:</label>
            <input type="text" name="apellido" required>

            <label>Correo:</label>
            <input type="email" name="correo" required>

            <label>Teléfono:</label>
            <input type="text" name="telefono" required>

            <label>Fecha de Nacimiento:</label>
            <input type="date" name="fecha_nacimiento" required>

            <label>Género:</label>
            <select name="genero" required>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
                <option value="Otro">Otro</option>
            </select>

            <label>Rol:</label>
            <select name="rol" required>
                <option value="Estudiante">Estudiante</option>
                <option value="Autor">Autor</option>
            </select>

            <label>Nombre de Usuario:</label>
            <input type="text" name="usuario" required placeholder="ej: laura123">

            <label>Contraseña:</label>
            <input type="password" name="contrasena" required placeholder="********">

            <button type="submit">Enviar Registro</button>
        </form>
        <a href="{% url 'catalogo:inicio' %}" class="btn-volver">← Volver al Inicio</a>
    </div>
</body>
</html>
